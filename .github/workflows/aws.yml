name: AWS images and plan

# Builds the API/query and compute images, pushes them to ECR (immutable git-SHA tags), and runs `terraform plan`
# for envs/dev. Applying is a human step (docs/DEPLOY.md). Runs only once a customer configures AWS access:
#   repository variables AWS_REGION, AWS_PLAN_ROLE_ARN (OIDC role), TF_STATE_BUCKET, TRIBUTARY_NAME,
#   and TF_VARS_DEV (the content of envs/dev/terraform.tfvars without image_tag).
on:
  workflow_dispatch:
  pull_request:
    paths: ['infra/terraform/**', 'deploy/render/node.Dockerfile', 'apps/compute/Dockerfile']

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: aws-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images-and-plan:
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          REG=${{ steps.ecr.outputs.registry }}/${{ vars.TRIBUTARY_NAME }}
          # Tags are immutable: a re-run for the same commit keeps the image already pushed.
          push() {
            if aws ecr describe-images --repository-name "${{ vars.TRIBUTARY_NAME }}/$1" \
              --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$1:$TAG already in ECR"
            else
              docker buildx build --platform linux/arm64 -f "$2" -t "$REG/$1:$TAG" --push .
            fi
          }
          push node deploy/render/node.Dockerfile
          push compute apps/compute/Dockerfile
      - uses: hashicorp/setup-terraform@v4.0.1
      - name: terraform plan (envs/dev)
        working-directory: infra/terraform/envs/dev
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '${{ vars.TF_VARS_DEV }}' > terraform.tfvars
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=tributary/dev.tfstate" -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          terraform plan -input=false -lock-timeout=5m -var "image_tag=$TAG" -no-color | tee plan.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: terraform-plan-dev
          path: infra/terraform/envs/dev/plan.txt
