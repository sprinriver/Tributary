# Local stack for development and e2e. Starts with no .env file: every value has a dev-only default
# (`${VAR:-default}`); overrides are documented in .env.example. Never reuse these values outside local dev.
name: tributary

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tributary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tributary-dev}
      POSTGRES_DB: ${POSTGRES_DB:-tributary}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3 API on 8333 and Iceberg REST catalog on 8181 (stands in for S3 + S3 Tables locally).
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: >-
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.port.iceberg=8181 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '${S3_PORT:-8333}:8333'
      - '${ICEBERG_PORT:-8181}:8181'
    volumes:
      - seaweedfs-data:/data
      - ./infra/local/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./infra/local/keycloak/tributary-realm.json:/opt/keycloak/data/import/tributary-realm.json:ro
    healthcheck:
      # The image has no curl/wget; probe the management port's readiness endpoint with bash.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
  seaweedfs-data:
