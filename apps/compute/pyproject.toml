[project]
name = "tributary-compute"
version = "0.0.0"
description = "Internal statistics, curve-fit, SDRF and synthetic-data service for Tributary"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pip-licenses==5.5.5",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test names start with their feature ID (test_OPS_01_...), and pytest uses bare asserts.
"tests/**" = ["S101", "N802"]

[tool.pyright]
include = ["tributary_compute", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
